name: 'Check Markdown table of contents'
description: 'Checks that the table of contents of Markdown files is the one VS Code Markdown All in One generates on save'
inputs:
  files:
    description: 'The Markdown files to check, separated by spaces or new lines'
    required: false
    default: 'README.md'
runs:
  using: 'node24'
  main: 'check/index.js'
