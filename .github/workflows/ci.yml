name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test
        run: npm test

      - name: Check this repo's README
        uses: ./

      - name: Validate changelog
        uses: ConfiguredThings/validate-changelog-action@v4
